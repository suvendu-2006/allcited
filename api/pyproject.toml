[project]
name = "allcited-api"
version = "0.1.0"
description = "Allcited API backend"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "httpx>=0.27.0",
    "python-multipart>=0.0.9",
    "python-docx>=1.1.0",
    "python-pptx>=1.0.0",
    "openpyxl>=3.1.0",
    "readability-lxml>=0.9.0",
    "beautifulsoup4>=4.12.0",
    "pyjwt[crypto]>=2.9.0",
    "stripe>=10.0.0",
    "torch>=2.0.0",
    "sentence-transformers>=2.2.0",
    "faiss-cpu>=1.7.4",
    "rank-bm25>=0.2.2",
    "pymupdf>=1.24.0",
    "pytesseract>=0.3.10",
    "easyocr>=1.7.0",
    "tabulate>=0.9.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6.0",
    "pytest>=8.3.0",
    "pytest-timeout>=2.3.1",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", ".."]
timeout = 60
markers = [
    "ocr: marks tests as involving OCR models (deselect with '-m \"not ocr\"')",
]
