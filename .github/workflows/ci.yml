name: CI

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  backend:
    name: Backend (Python 3.12 & FastAPI)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: api/requirements.txt

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-eng tesseract-ocr-hin

      - name: Install dependencies
        run: cd api && pip install -r requirements.txt && pip install ruff pytest pytest-timeout

      - name: Lint with ruff
        working-directory: api
        run: ruff check .

      - name: Check formatting with ruff
        working-directory: api
        run: ruff format --check .

      - name: Run pytest test suite
        working-directory: api
        env:
          TESTING: "true"
          MODE: "cloud"
          NVIDIA_API_KEY: "nvapi-mock-ci-test-key-12345678"
          CLERK_SECRET_KEY: "sk_test_ci_mock_clerk_key"
          SUPABASE_URL: "https://mock.supabase.co"
          SUPABASE_SERVICE_ROLE_KEY: "mock_service_key"
        run: pytest tests/ -v --timeout=60

  frontend:
    name: Frontend (Next.js 14 & TypeScript)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint with ESLint
        run: npm run lint

      - name: Strict typecheck with TypeScript
        run: npx tsc --noEmit

      - name: Run native test suite
        run: npm test

      - name: Build Next.js production bundle
        env:
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: "pk_test_ci_mock_clerk_key_12345"
        run: npm run build

  security-and-hygiene:
    name: Security & Repository Hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks secret scanner
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check git status for uncommitted artifacts
        run: |
          rm -f results.sarif
          if [ -n "$(git status --porcelain)" ]; then
            echo "Working tree has uncommitted changes or untracked artifacts:"
            git status --porcelain
            exit 1
          fi
          echo "Working tree is clean."
