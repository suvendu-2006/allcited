name: Allcited CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend Lint & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-eng tesseract-ocr-hin

      - name: Install Python dependencies
        run: |
          cd api
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff pytest

      - name: Lint with ruff
        run: |
          cd api
          ruff check .

      - name: Run unit test suite
        env:
          ENVIRONMENT: test
          NVIDIA_API_KEY: nvapi-ci-mock-key
          CLERK_SECRET_KEY: test_clerk_secret_key
        run: |
          cd api
          python -m pytest tests/

  frontend:
    name: Frontend Build & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: |
          cd web
          npm ci

      - name: Run unit tests
        run: |
          cd web
          npm test

      - name: Build Next.js
        run: |
          cd web
          npm run build
