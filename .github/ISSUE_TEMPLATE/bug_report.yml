name: Bug Report
description: File a bug report to help us improve Allcited
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a bug in Allcited!
        
        > [!IMPORTANT]
        > If you believe you have discovered a **security vulnerability**, do not use this public form. Please refer to our [Security Policy](https://github.com/suvendu-2006/allcited/security/policy) to report it privately.

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: Describe the problem clearly...
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: How can maintainers reproduce the issue step by step?
      placeholder: |
        1. Start the API with '...'
        2. Upload document '...'
        3. Trigger query '...'
        4. Observe the failure
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
      placeholder: Explain what should happen under normal operation...
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened instead?
      placeholder: Explain what failed or produced incorrect output...
    validations:
      required: true

  - type: dropdown
    id: component
    attributes:
      label: Affected Component
      description: Which subsystem is experiencing the issue?
      options:
        - Backend API (FastAPI)
        - Frontend Web (Next.js)
        - Document Extraction & OCR (Tesseract / PyMuPDF)
        - Vector Retrieval & Reranking
        - Authentication & Tenant Scoping (Clerk)
        - Database & Migrations (Supabase / Postgres)
        - Docker & Container Infrastructure
        - Other
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating System
      description: e.g., macOS 14.5 (Apple Silicon), Ubuntu 22.04 LTS, Debian 12, Windows 11 WSL2
      placeholder: e.g., macOS 14.5
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment & Runtime Versions
      description: Provide the specific Python, Node.js, and browser versions in use.
      placeholder: e.g., Python 3.12.3, Node.js 22.2.0, Chrome 125.0
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs, Stack Traces, or Terminal Output
      description: Paste any relevant terminal logs, pytest failures, or browser console output.
      render: shell

  - type: textarea
    id: context
    attributes:
      label: Additional Context & Screenshots
      description: Add any other context or attach screenshots/files here.

  - type: checkboxes
    id: checklist
    attributes:
      label: Verification Checklist
      description: Please verify before submitting.
      options:
        - label: I have searched existing issues to ensure this is not a duplicate.
          required: true
        - label: This report does NOT contain sensitive API keys, personal credentials, or confidential client documents.
          required: true
        - label: This is not a security vulnerability (security issues must be reported privately per SECURITY.md).
          required: true
